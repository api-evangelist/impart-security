aid: impart-security
name: Impart Security
description: 'Impart Security is a runtime security platform that unifies WAF, API
  security, and AI/LLM/agent/MCP protection on one inline enforcement engine. It analyzes
  the full request/response flow — headers, parameters, query strings, and bodies —
  models API behavior with machine learning, detects anomalies from a learned baseline,
  and takes inline mitigation actions (alert, block, behavioral rate limiting, deception,
  tarpits) before requests reach backend systems. Impart also auto-generates OpenAPI
  documentation from live traffic, integrates with gateways such as Kong, and ships
  a programmable rules engine managed as code via first-party Terraform and Pulumi
  providers against its v0 REST API. Founded by Jonathan DiVincenzo, Marc Harrison,
  and Brian Joe; backed by Madrona, CRV, 8-bit Capital, and Haystack. SOC 2 Type II
  certified and GDPR ready.'
